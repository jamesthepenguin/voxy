name: Build jar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use 21 for Minecraft 1.21.x. Newer Minecraft versions (26.x) may need 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: List jars that were built
        if: always()
        run: find . -name "*.jar" -path "*build/libs*" -print

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-dev.jar
          if-no-files-found: error
